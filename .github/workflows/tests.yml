name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Repo layout check
        shell: cmd
        run: |
          if not exist src\main.c exit 1
          if not exist include\vexel.h exit 1
          if not exist tests\run_tests.bat exit 1
          if not exist operators\VexGUI\operator.vxop exit 1
          if not exist docs\html\index.html exit 1

      - name: Full suite
        shell: cmd
        run: |
          copy /y build\vexel.exe vexel.exe
          call tests\run_tests.bat
